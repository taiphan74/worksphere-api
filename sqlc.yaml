version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/database/query"
    schema: "migrations/*.up.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/database/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
